spring:
  datasource:
    url: jdbc:mysql://localhost:3307/video_player?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: videos

dub:
  python: ./venv/Scripts/python.exe
  script: ./scripts/dub_pipeline.py
  model: base
  voice: fr-FR-HenriNeural
  temp-dir: ./dub-tmp

server:
  port: 8080
