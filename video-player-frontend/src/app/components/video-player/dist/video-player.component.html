<div class="w-full bg-surface-900 min-h-screen">
  <div class="flex max-w-[1600px] mx-auto">
    <div class="flex-1 min-w-0 p-5">
      <div class="relative w-full bg-black rounded-lg overflow-hidden aspect-video cursor-pointer" id="video-container" (mousemove)="onMouseMove()" (dblclick)="toggleFullscreen()">
        <video
          #videoElement
          [src]="getStreamUrl(currentVideo?.id ?? 0)"
          class="w-full h-full block bg-black"
          (loadedmetadata)="onLoadedMetadata()"
          (timeupdate)="onTimeUpdate()"
          (ended)="onEnded()"
          (click)="togglePlay()"
          [controls]="false">
        </video>

        <div class="absolute inset-0 flex items-center justify-center bg-black/40 z-[5]" *ngIf="!isPlaying" (click)="togglePlay()">
          <div class="flex items-center justify-center w-[100px] h-[100px] rounded-full bg-white/10 backdrop-blur">
            <svg viewBox="0 0 24 24" width="80" height="80" class="ml-2" fill="white">
              <path d="M8 5v14l11-7z"/>
            </svg>
          </div>
        </div>

        <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/90 to-transparent px-4 pb-4 pt-[60px] z-10 opacity-100 transition-opacity duration-300" *ngIf="showControls">
          <div class="mb-2">
            <input
              type="range"
              class="seek-slider w-full"
              [min]="0"
              [max]="duration || 0"
              [value]="currentTime"
              (input)="seekTo($event)">
            <div class="text-white text-[13px] mt-1.5">
              <span>{{ formatTime(currentTime) }}</span>
              <span class="mx-1 text-white/60">/</span>
              <span>{{ formatTime(duration) }}</span>
            </div>
          </div>

          <div class="flex items-center justify-between">
            <div class="flex items-center gap-1">
              <button class="bg-transparent border-none text-white cursor-pointer p-2 flex items-center justify-center rounded-full transition-colors hover:bg-white/10" (click)="togglePlay()">
                <svg *ngIf="!isPlaying" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                  <path d="M8 5v14l11-7z"/>
                </svg>
                <svg *ngIf="isPlaying" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                  <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
              </button>

              <button class="bg-transparent border-none text-white cursor-pointer p-2 flex items-center justify-center rounded-full transition-colors hover:bg-white/10" (click)="previousVideo()" *ngIf="currentIndex > 0">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                  <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                </svg>
              </button>

              <button class="bg-transparent border-none text-white cursor-pointer p-2 flex items-center justify-center rounded-full transition-colors hover:bg-white/10" (click)="skip(-10)">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                  <path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
                </svg>
              </button>

              <button class="bg-transparent border-none text-white cursor-pointer p-2 flex items-center justify-center rounded-full transition-colors hover:bg-white/10" (click)="skip(10)">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                  <path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/>
                </svg>
              </button>

              <button class="bg-transparent border-none text-white cursor-pointer p-2 flex items-center justify-center rounded-full transition-colors hover:bg-white/10" (click)="nextVideo()" *ngIf="currentIndex < videos.length - 1">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                  <path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z"/>
                </svg>
              </button>

              <div class="flex items-center gap-1">
                <button class="bg-transparent border-none text-white cursor-pointer p-2 flex items-center justify-center rounded-full transition-colors hover:bg-white/10" (click)="toggleMute()">
                  <svg *ngIf="!isMuted" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                  </svg>
                  <svg *ngIf="isMuted" viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                    <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                  </svg>
                </button>
                <input
                  type="range"
                  class="volume-slider"
                  min="0"
                  max="1"
                  step="0.05"
                  [value]="volume"
                  (input)="onVolumeChange($event)">
              </div>
            </div>

            <div class="flex items-center gap-1">
              <div class="relative">
                <button class="bg-transparent border-none cursor-pointer p-2 flex items-center justify-center rounded-full transition-colors hover:bg-white/10" (click)="showSpeedMenu = !showSpeedMenu">
                  <span class="text-white text-sm">{{ playbackRate }}x</span>
                </button>
                <div class="absolute bottom-full right-0 bg-surface-600 rounded-lg py-2 min-w-[80px] shadow-lg z-[100]" *ngIf="showSpeedMenu">
                  <button *ngFor="let r of [0.5, 0.75, 1, 1.25, 1.5, 2]" (click)="changeRate(r)"
                    class="block w-full px-4 py-2 bg-transparent border-none text-white cursor-pointer text-center hover:bg-white/10">{{ r }}x</button>
                </div>
              </div>

              <button (click)="toggleLoop()">{{loopEnabled ? 'Desactiver la boucle' : 'Activer la boucle'}}</button>

              <button class="bg-transparent border-none text-white cursor-pointer p-2 flex items-center justify-center rounded-full transition-colors hover:bg-white/10" (click)="toggleFullscreen()">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                  <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="py-4 text-white" *ngIf="currentVideo">
        <div class="flex items-center justify-between gap-4">
          <h2 class="m-0 mb-2 text-lg font-medium flex-1">{{ currentVideo.title }}</h2>
          <button class="bg-transparent border-none text-neutral-400 text-xl cursor-pointer p-2 rounded-full transition-colors hover:text-white hover:bg-white/10" (click)="close.emit()">✕</button>
        </div>
        <p class="m-0 text-neutral-400 text-sm">{{ currentVideo.description }}</p>
      </div>
    </div>

    <div class="flex-[0_0_320px] border-l border-surface-600 px-5 py-5 h-screen overflow-y-auto bg-surface-900" *ngIf="videos.length > 0">
      <h3 class="text-white font-medium text-base m-0 mb-4 pb-3 border-b-2 border-brand-red">Playlist ({{ videos.length }})</h3>
      <div class="flex flex-col gap-2">
        <div
          class="flex items-center gap-3 px-2.5 py-2.5 rounded-lg bg-surface-700 cursor-pointer transition-colors hover:bg-surface-600 min-h-[50px] [&.active]:bg-brand-red/10 [&.active]:border [&.active]:border-brand-red/30"
          *ngFor="let video of videos; let i = index"
          [class.active]="video.id === currentVideo?.id"
          (click)="onSelectVideo(video)">
          <div class="w-6 h-6 rounded-full bg-surface-500 flex items-center justify-center text-xs text-white flex-shrink-0 [.active_&]:bg-brand-red">{{ i + 1 }}</div>
          <div class="flex-1 min-w-0">
            <div class="text-white text-sm whitespace-nowrap overflow-hidden text-ellipsis">{{ video.title }}</div>
            <div  class="text-neutral-400 text-xs mt-0.5">{{ formatSize(video.fileSize) }}</div>
          </div>
          <div class="text-brand-red flex-shrink-0" *ngIf="video.id === currentVideo?.id">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
