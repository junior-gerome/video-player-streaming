<div class="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center z-[1000] p-4 animate-in fade-in duration-150">
  <div class="bg-surface-900 border border-white/[0.1] rounded-2xl w-full max-w-[480px] overflow-hidden shadow-2xl animate-in zoom-in-95 duration-150">
    <!-- En-tête du modal -->
    <div class="flex items-center justify-between px-6 py-4 border-b border-white/[0.07]">
      <div class="flex items-center gap-2">
        <div class="w-2 h-2 rounded-full bg-brand-red"></div>
        <h2 class="text-zinc-100 font-semibold text-sm m-0">Importer un fichier média</h2>
      </div>
      <button class="bg-transparent border-none text-zinc-400 hover:text-white text-base cursor-pointer p-1 rounded-full transition-colors" (click)="close()">✕</button>
    </div>

    <!-- Corps du modal -->
    <div class="p-6">
      <div
        class="border-2 border-dashed border-white/[0.12] rounded-xl px-5 py-8 text-center cursor-pointer transition-all mb-5 hover:border-brand-red/50 hover:bg-brand-red/[0.02] [&.dragover]:border-brand-red [&.dragover]:bg-brand-red/[0.04] [&.has-file]:border-emerald-500/50 [&.has-file]:bg-emerald-500/[0.03]"
        [class.dragover]="dragOver"
        [class.has-file]="selectedFile"
        (dragover)="onDragOver($event)"
        (dragleave)="onDragLeave()"
        (drop)="onDrop($event)">

        <ng-container *ngIf="!selectedFile; else filePreview">
          <div class="w-12 h-12 rounded-xl bg-surface-800 border border-white/[0.08] flex items-center justify-center mx-auto mb-3 text-zinc-400 shadow-sm">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
              <path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/>
            </svg>
          </div>
          <p class="text-zinc-300 text-xs font-medium m-0 mb-1">Glissez votre vidéo ici ou</p>
          <button
            type="button"
            class="bg-surface-800 hover:bg-surface-700 border border-white/[0.12] text-zinc-200 text-xs px-4 py-1.5 rounded-full cursor-pointer transition-all my-2 shadow-sm"
            (click)="fileInput.click()">
            Parcourir les fichiers
          </button>
          <p class="text-zinc-500 text-[11px] m-0 mt-1 font-mono">MP4, WebM, OGG, MKV • Max 2 Go</p>
        </ng-container>

        <ng-template #filePreview>
          <div class="flex flex-col items-center gap-2">
            <div class="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
              </svg>
            </div>
            <div class="text-zinc-100 text-xs font-medium break-all max-w-xs">{{ selectedFile?.name }}</div>
            <div class="text-zinc-400 text-[11px] font-mono">{{ formatSize(selectedFile!.size) }}</div>
            <button
              type="button"
              class="bg-transparent border border-rose-500/40 text-rose-400 hover:bg-rose-500/10 px-3 py-1 rounded-full cursor-pointer text-[11px] mt-1 transition-colors"
              (click)="removeFile()">
              Changer de fichier
            </button>
          </div>
        </ng-template>
      </div>

      <input
        #fileInput
        type="file"
        accept="video/*,.mp4,.webm,.ogg,.mov,.avi,.mkv"
        hidden
        (change)="onFileSelected($event)">

      <div class="mb-4">
        <label for="title" class="block text-zinc-300 text-xs font-medium mb-1.5">Titre de la vidéo</label>
        <input
          id="title"
          type="text"
          [(ngModel)]="title"
          placeholder="ex: Conférence IA & Doublage"
          class="w-full px-3.5 py-2.5 bg-surface-800 border border-white/[0.08] hover:border-white/[0.15] focus:border-brand-red/60 focus:ring-2 focus:ring-brand-red/20 rounded-lg text-zinc-100 text-xs box-border placeholder:text-zinc-600 focus:outline-none transition-all">
      </div>

      <div class="mb-4">
        <label for="description" class="block text-zinc-300 text-xs font-medium mb-1.5">Description (optionnelle)</label>
        <textarea
          id="description"
          [(ngModel)]="description"
          placeholder="Brève description du contenu…"
          rows="3"
          class="w-full px-3.5 py-2.5 bg-surface-800 border border-white/[0.08] hover:border-white/[0.15] focus:border-brand-red/60 focus:ring-2 focus:ring-brand-red/20 rounded-lg text-zinc-100 text-xs box-border placeholder:text-zinc-600 focus:outline-none resize-y min-h-[64px] transition-all"></textarea>
      </div>

      <div class="mt-4" *ngIf="uploading">
        <div class="w-full h-1.5 bg-surface-800 rounded-full overflow-hidden">
          <div class="h-full bg-brand-red rounded-full transition-all duration-200" [style.width.%]="uploadProgress"></div>
        </div>
        <span class="block text-center text-zinc-400 text-[11px] font-mono mt-1.5">{{ uploadProgress }}% transféré</span>
      </div>

      <div class="bg-rose-500/10 border border-rose-500/25 text-rose-300 px-3.5 py-2 rounded-lg text-xs mt-4" *ngIf="error">
        {{ error }}
      </div>
    </div>

    <!-- Pied de page du modal -->
    <div class="flex justify-end gap-2.5 px-6 py-4 border-t border-white/[0.07] bg-surface-950/40">
      <button
        class="bg-surface-800 hover:bg-surface-700 border border-white/[0.08] text-zinc-300 px-4 py-2 rounded-lg text-xs font-medium cursor-pointer transition-all disabled:opacity-40"
        (click)="close()"
        [disabled]="uploading">
        Annuler
      </button>
      <button
        class="bg-brand-red hover:bg-brand-dark text-white border-none px-5 py-2 rounded-lg text-xs font-medium cursor-pointer transition-all shadow-sm shadow-brand-red/25 disabled:opacity-40 disabled:cursor-not-allowed"
        (click)="upload()"
        [disabled]="uploading || !selectedFile || !title.trim()">
        {{ uploading ? 'Envoi en cours…' : 'Importer la vidéo' }}
      </button>
    </div>
  </div>
</div>
