services:
  ai-service:
    build: ./ai-service
    ports: ["8000:8000"]
    environment:
      WHISPER_MODEL: small        # tiny | base | small | medium | large-v3
      WHISPER_DEVICE: cpu         # cuda si GPU NVIDIA
      WHISPER_COMPUTE: int8       # float16 sur GPU
    volumes:
      - hf-cache:/root/.cache/huggingface        # modèles Whisper
      - argos-data:/root/.local/share/argos-translate  # paquets de traduction

  backend:
    build: ./backend
    ports: ["8080:8080"]
    environment:
      AI_SERVICE_URL: http://ai-service:8000
    depends_on: [ai-service]

volumes:
  hf-cache:
  argos-data:
